<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | AttachLink</title><link rel="stylesheet" href="../../assets/tailwind.min.css">
<link rel="stylesheet" href="../../assets/attachlink-auth.css">
<script src="../../assets/attachlink-signin.js" defer></script>
</head>
<body class="al-auth">
<main class="al-auth-layout">
  <section class="al-auth-brand">
    <a aria-label="AttachLink home" href="../../"><img src="../employers/attachlink-logo.svg" alt="AttachLink"></a>
    <div><h1>Connecting talent with opportunity</h1><p>Find industrial attachments, connect with employers and manage your next step in one place.</p></div>
  </section>
  <section class="al-auth-card" aria-labelledby="signin-title">
    <h2 id="signin-title">Sign in</h2>
    <fieldset class="al-role"><legend>Choose your portal</legend>
      <label><input type="radio" name="role" value="student" checked><span>Student</span></label>
      <label><input type="radio" name="role" value="employer"><span>Company</span></label>
      <label><input type="radio" name="role" value="admin"><span>Administrator</span></label>
    </fieldset>
    <p id="portal-description" class="al-auth-copy"></p>
    <form method="post" id="signin-form">
      <label for="email">Email</label>
      <input class="al-auth-input" id="email" name="email" type="email" autocomplete="username" maxlength="190" required>
      <label for="password">Password</label>
      <div class="al-auth-password">
        <input class="al-auth-input" id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="al-auth-reveal" id="reveal-password" aria-controls="password">Show</button>
      </div>
      <button class="al-auth-primary" type="submit" disabled>Sign in</button>
      <p id="signin-status" role="status" aria-live="polite"></p>
    </form><p><a class="underline" href="../../account-recovery.php">Forgot your password?</a></p>
    <a class="al-auth-secondary" id="register-link" href="register.html">Create Student Account</a>
  </section>
</main>
</body>
</html>
